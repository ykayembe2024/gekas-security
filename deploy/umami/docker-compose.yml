services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami-gekas
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_gekas_db_2026@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: 39ba71fd830c50eea267148076e64c47b8adeb24721eb22d403db0516e36b460
      TRACKER_SCRIPT_NAME: script.js
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: umami-gekas-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_gekas_db_2026
    volumes:
      - umami-gekas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  umami-gekas-db-data:
